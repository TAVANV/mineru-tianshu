# Tianshu (天枢) - Registry-based Docker Compose
# 基于镜像仓库部署（所有镜像从阿里云 ACR 等仓库拉取）
#
# 使用方式:
#   1. 复制 .env.example 为 .env 并配置（包括 REGISTRY_PREFIX）
#   2. 登录镜像仓库: docker login registry.cn-xxx.aliyuncs.com
#   3. 拉取并启动:
#      docker-compose -f docker-compose.registry.yml up -d
#   4. 查看日志: docker-compose -f docker-compose.registry.yml logs -f
#   5. 停止: docker-compose -f docker-compose.registry.yml down
#
# 前置要求:
#   - Docker 20.10+
#   - Docker Compose 2.0+
#   - NVIDIA GPU + NVIDIA Driver 525+ + NVIDIA Container Toolkit
#   - 已登录镜像仓库

# 项目名称
name: tianshu

services:
  # ============================================================================
  # Redis (高性能任务队列 - 可选)
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: tianshu-redis
    restart: unless-stopped
    profiles:
      - redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    environment:
      - TZ=Asia/Shanghai
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - tianshu-network

  # ============================================================================
  # RustFS Object Storage (S3 Compatible)
  # ============================================================================
  rustfs:
    image: rustfs/rustfs:latest
    container_name: tianshu-rustfs
    restart: unless-stopped
    ports:
      - "${RUSTFS_PORT:-9000}:9000"
      - "${RUSTFS_CONSOLE_PORT:-9001}:9001"
    volumes:
      - rustfs-data:/data
      - rustfs-logs:/logs
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    environment:
      - TZ=Asia/Shanghai
      - RUSTFS_ROOT_USER=${RUSTFS_ACCESS_KEY:-rustfsadmin}
      - RUSTFS_ROOT_PASSWORD=${RUSTFS_SECRET_KEY:-rustfsadmin}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - tianshu-network

  # ============================================================================
  # Backend API Server
  # ============================================================================
  backend:
    image: ${REGISTRY_PREFIX:-registry.cn-hangzhou.aliyuncs.com/yourns}/tianshu-backend:${BACKEND_TAG:-latest}
    container_name: tianshu-backend
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      # 离线模型目录(只读，通过 OFFLINE_MODELS_PATH 指定主机路径；有就用，缺失直接报错不下载)
      - ${OFFLINE_MODELS_PATH:-./models-offline}:/app/models:ro
      - ${OFFLINE_MODELS_PATH:-./models-offline}/paddlex_cache:/root/.paddlex:ro
      - ${OFFLINE_MODELS_PATH:-./models-offline}/paddleocr_cache:/root/.paddleocr:ro
      - ${OFFLINE_MODELS_PATH:-./models-offline}/modelscope_cache:/root/.cache/modelscope:ro
      - ${OFFLINE_MODELS_PATH:-./models-offline}/huggingface_cache:/root/.cache/huggingface:ro
      - ${OFFLINE_MODELS_PATH:-./models-offline}/torch_cache:/root/.cache/torch:ro
      - ${OFFLINE_MODELS_PATH:-./models-offline}/watermark_models:/root/.cache/watermark_models:ro
      # 数据目录
      - ./data/uploads:/app/data/uploads:rw
      - ./data/output:/app/data/output:rw
      - ./logs/backend:/app/logs:rw
      - ./data/db:/app/data/db:rw
      # 时区
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    environment:
      - TZ=Asia/Shanghai
      - HOST=0.0.0.0
      - API_PORT=8000
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:80}
      - CUDA_VISIBLE_DEVICES=${CUDA_VISIBLE_DEVICES:-0}
      - WORKER_URL=${WORKER_URL:-http://worker:8001}
      - MAX_FILE_SIZE=${MAX_FILE_SIZE:-0}
      - MODEL_PATH=/app/models
      - OUTPUT_PATH=/app/data/output
      - UPLOAD_PATH=/app/data/uploads
      - DATABASE_PATH=${DATABASE_PATH:-/app/data/db/mineru_tianshu.db}
      - RUSTFS_ENABLED=${RUSTFS_ENABLED:-true}
      - RUSTFS_ENDPOINT=${RUSTFS_ENDPOINT:-rustfs:9000}
      - RUSTFS_ACCESS_KEY=${RUSTFS_ACCESS_KEY:-rustfsadmin}
      - RUSTFS_SECRET_KEY=${RUSTFS_SECRET_KEY:-rustfsadmin}
      - RUSTFS_BUCKET=${RUSTFS_BUCKET:-ts-img}
      - RUSTFS_SECURE=${RUSTFS_SECURE:-false}
      - RUSTFS_PUBLIC_URL=${RUSTFS_PUBLIC_URL}
      # 模型配置(纯离线本地模型：有就用，缺失直接报错，绝不联网下载)
      - MODEL_DOWNLOAD_SOURCE=local
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
      - HF_HOME=/root/.cache/huggingface
      - HF_ENDPOINT=
      - HF_TOKEN=${HF_TOKEN:-}
      - MODELSCOPE_OFFLINE=1
      - MODELSCOPE_CACHE=/root/.cache/modelscope
      - MINERU_MODEL_SOURCE=local
      - MINERU_TOOLS_CONFIG_JSON=mineru.json
      - PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK=True
      - PADDLEX_HOME=/root/.paddlex
      - PADDLE_HOME=/root/.paddleocr
      - TORCH_HOME=/root/.cache/torch
      - LAMA_MODEL=/app/models/big-lama.pt
      - YOLO_CONFIG_DIR=/app/data
      - ULTRALYTICS_CONFIG_DIR=/app/data/Ultralytics
      - YOLO_OFFLINE=True
      - REDIS_QUEUE_ENABLED=${REDIS_QUEUE_ENABLED:-false}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_DB=${REDIS_DB:-0}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: ${GPU_COUNT:-1}
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - tianshu-network
    depends_on:
      worker:
        condition: service_started
      rustfs:
        condition: service_started

  # ============================================================================
  # LitServe Worker
  # ============================================================================
  worker:
    image: ${REGISTRY_PREFIX:-registry.cn-hangzhou.aliyuncs.com/yourns}/tianshu-backend:${BACKEND_TAG:-latest}
    container_name: tianshu-worker
    restart: unless-stopped
    command: ["worker", "python", "litserve_worker.py"]
    ports:
      - "${WORKER_PORT:-8001}:8001"
    volumes:
      # 离线模型目录(只读，通过 OFFLINE_MODELS_PATH 指定主机路径；有就用，缺失直接报错不下载)
      - ${OFFLINE_MODELS_PATH:-./models-offline}:/app/models:ro
      - ${OFFLINE_MODELS_PATH:-./models-offline}/paddlex_cache:/root/.paddlex:ro
      - ${OFFLINE_MODELS_PATH:-./models-offline}/paddleocr_cache:/root/.paddleocr:ro
      - ${OFFLINE_MODELS_PATH:-./models-offline}/modelscope_cache:/root/.cache/modelscope:ro
      - ${OFFLINE_MODELS_PATH:-./models-offline}/huggingface_cache:/root/.cache/huggingface:ro
      - ${OFFLINE_MODELS_PATH:-./models-offline}/torch_cache:/root/.cache/torch:ro
      - ${OFFLINE_MODELS_PATH:-./models-offline}/watermark_models:/root/.cache/watermark_models:ro
      # 数据目录
      - ./data/uploads:/app/data/uploads:rw
      - ./data/output:/app/data/output:rw
      - ./logs/worker:/app/logs:rw
      - ./data/db:/app/data/db:rw
      # 时区
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    environment:
      - TZ=Asia/Shanghai
      - HOST=0.0.0.0
      - WORKER_PORT=8001
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - WORKER_GPUS=${WORKER_GPUS:-2}
      - MODEL_PATH=/app/models
      - OUTPUT_PATH=/app/data/output
      - UPLOAD_PATH=/app/data/uploads
      - DATABASE_PATH=${DATABASE_PATH:-/app/data/db/mineru_tianshu.db}
      - MAX_BATCH_SIZE=${MAX_BATCH_SIZE:-4}
      - TIMEOUT=${WORKER_TIMEOUT:-300}
      # 模型配置(纯离线本地模型：有就用，缺失直接报错，绝不联网下载)
      - MODEL_DOWNLOAD_SOURCE=local
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
      - HF_HOME=/root/.cache/huggingface
      - HF_ENDPOINT=
      - HF_TOKEN=${HF_TOKEN:-}
      - MODELSCOPE_OFFLINE=1
      - MODELSCOPE_CACHE=/root/.cache/modelscope
      - MINERU_MODEL_SOURCE=local
      - MINERU_TOOLS_CONFIG_JSON=mineru.json
      - PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK=True
      - PADDLEX_HOME=/root/.paddlex
      - PADDLE_HOME=/root/.paddleocr
      - TORCH_HOME=/root/.cache/torch
      - LAMA_MODEL=/app/models/big-lama.pt
      - YOLO_CONFIG_DIR=/app/data
      - ULTRALYTICS_CONFIG_DIR=/app/data/Ultralytics
      - YOLO_OFFLINE=True
      - PDF_SPLIT_ENABLED=${PDF_SPLIT_ENABLED:-true}
      - PDF_SPLIT_THRESHOLD_PAGES=${PDF_SPLIT_THRESHOLD_PAGES:-500}
      - PDF_SPLIT_CHUNK_SIZE=${PDF_SPLIT_CHUNK_SIZE:-250}
      - PDF_SPLIT_SIZE_MB=${PDF_SPLIT_SIZE_MB:-20}
      - RUSTFS_ENABLED=${RUSTFS_ENABLED:-true}
      - RUSTFS_ENDPOINT=${RUSTFS_ENDPOINT:-rustfs:9000}
      - RUSTFS_ACCESS_KEY=${RUSTFS_ACCESS_KEY:-rustfsadmin}
      - RUSTFS_SECRET_KEY=${RUSTFS_SECRET_KEY:-rustfsadmin}
      - RUSTFS_BUCKET=${RUSTFS_BUCKET:-ts-img}
      - RUSTFS_SECURE=${RUSTFS_SECURE:-false}
      - RUSTFS_PUBLIC_URL=${RUSTFS_PUBLIC_URL}
      - REDIS_QUEUE_ENABLED=${REDIS_QUEUE_ENABLED:-false}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_DB=${REDIS_DB:-0}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    mem_limit: ${WORKER_MEMORY_LIMIT:-32G}
    memswap_limit: ${WORKER_MEMSWAP_LIMIT:-40G}
    mem_reservation: ${WORKER_MEMORY_RESERVATION:-16G}
    deploy:
      resources:
        limits:
          memory: ${WORKER_MEMORY_LIMIT:-32G}
        reservations:
          memory: ${WORKER_MEMORY_RESERVATION:-16G}
          devices:
            - driver: nvidia
              count: ${GPU_COUNT:-1}
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    networks:
      - tianshu-network
    depends_on:
      rustfs:
        condition: service_started

  # ============================================================================
  # Task Scheduler
  # ============================================================================
  scheduler:
    image: ${REGISTRY_PREFIX:-registry.cn-hangzhou.aliyuncs.com/yourns}/tianshu-backend:${BACKEND_TAG:-latest}
    container_name: tianshu-scheduler
    restart: unless-stopped
    # ⚠️ entrypoint 无 "scheduler" 分支：command 不能带 "scheduler" 前缀(否则 exec 失败)，直接用 python
    command: ["python", "task_scheduler.py",
      "--litserve-url", "http://worker:8001/predict",
      "--monitor-interval", "60",
      "--stale-task-timeout", "30",
      "--cleanup-old-files-days", "${CLEANUP_OLD_FILES_DAYS:-7}",
      "--wait-for-workers"]
    volumes:
      - ./data/db:/app/data/db:rw
      - ./data/output:/app/data/output:rw
      - ./logs/scheduler:/app/logs:rw
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    environment:
      - TZ=Asia/Shanghai
      - DATABASE_PATH=${DATABASE_PATH:-/app/data/db/mineru_tianshu.db}
      - OUTPUT_PATH=/app/data/output
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      # entrypoint 对非 worker/mcp 服务强制校验 JWT_SECRET_KEY，缺失会 exit 1 导致重启循环
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      # scheduler 不挂模型，设 auto 避免 MODEL_DOWNLOAD_SOURCE=local 触发离线模型校验而退出
      - MODEL_DOWNLOAD_SOURCE=auto
    networks:
      - tianshu-network
    depends_on:
      - worker
      - backend

  # ============================================================================
  # MCP Server
  # ============================================================================
  mcp-server:
    image: ${REGISTRY_PREFIX:-registry.cn-hangzhou.aliyuncs.com/yourns}/tianshu-backend:${BACKEND_TAG:-latest}
    container_name: tianshu-mcp
    restart: unless-stopped
    command: ["mcp", "python", "mcp_server.py"]
    ports:
      - "${MCP_PORT:-8002}:8002"
    volumes:
      - ./mcp_config.example.json:/app/backend/mcp_config.json:ro
      - ./logs/mcp:/app/logs:rw
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    environment:
      - TZ=Asia/Shanghai
      - HOST=0.0.0.0
      - MCP_PORT=8002
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - API_URL=${API_URL:-http://backend:8000}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - tianshu-network
    depends_on:
      - backend

  # ============================================================================
  # Frontend (Vue 3 + Nginx)
  # ============================================================================
  frontend:
    image: ${REGISTRY_PREFIX:-registry.cn-hangzhou.aliyuncs.com/yourns}/tianshu-frontend:${FRONTEND_TAG:-latest}
    container_name: tianshu-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    environment:
      - TZ=Asia/Shanghai
      - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:8000}
      - NGINX_CLIENT_MAX_BODY_SIZE=${NGINX_CLIENT_MAX_BODY_SIZE:-0}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - tianshu-network
    depends_on:
      - backend

networks:
  tianshu-network:
    driver: bridge
    name: tianshu-network
    ipam:
      driver: default
      config:
        - subnet: 172.30.0.0/16
          gateway: 172.30.0.1

volumes:
  redis-data:
    driver: local
    name: tianshu-redis-data
  rustfs-data:
    driver: local
    name: tianshu-rustfs-data
  rustfs-logs:
    driver: local
    name: tianshu-rustfs-logs
